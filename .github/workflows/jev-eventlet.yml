name: JEV Eventlet Experiment

on:
  push:
    branches:
      - jev-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout historical Eventlet commit
        uses: actions/checkout@v4
        with:
          ref: 3ec6317d

      - name: Verify Eventlet commit
        run: |
          git rev-parse HEAD
          git log -1 --oneline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run Eventlet tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -q --junitxml=reports/junit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventlet-junit
          path: reports/junit.xml
          if-no-files-found: warn