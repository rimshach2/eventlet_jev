
name: JEV Eventlet Experiment

on:
  push:
    branches:
      - jev-experiment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout historical Eventlet commit
      - name: Checkout historical Eventlet commit
        uses: actions/checkout@v4
        with:
          ref: 3ec6317dfc39403ff9e8aed88123bceb9b20a819
          fetch-depth: 0

      # Step 2: Verify commit
      - name: Verify Eventlet commit
        run: |
          echo "Testing Eventlet commit:"
          git rev-parse HEAD
          git log -1 --oneline

      # Step 3: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 4: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # Step 5: Execute Eventlet tests
      - name: Run Eventlet tests
        run: |
          mkdir -p reports
          python -m pytest tests/ -q --junitxml=reports/junit.xml

      # Step 6: Classify failures using JEV
      - name: Classify failures with JEV
        id: jev
        if: always()
        uses: JevForge/jev-flaky-detective@v0
        with:
          junit_path: reports/junit.xml
          decision_mode: deterministic
          dry_run: 'true'
          create_check_run: 'false'
          write_report_artifact: 'true'

      # Step 7: Print JEV results
      - name: Print JEV results
        if: always()
        env:
          JEV_DECISION: ${{ steps.jev.outputs.decision }}
          JEV_FAILURE_TYPE: ${{ steps.jev.outputs.failure_type }}
          JEV_CLASSIFICATIONS: ${{ steps.jev.outputs.classifications }}
          JEV_SUMMARY: ${{ steps.jev.outputs.summary }}
        run: |
          echo "JEV Decision: $JEV_DECISION"
          echo "Failure Type: $JEV_FAILURE_TYPE"
          echo "Classifications: $JEV_CLASSIFICATIONS"
          echo "Summary: $JEV_SUMMARY"

      # Step 8: Upload JUnit XML
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventlet-junit
          path: reports/junit.xml
          if-no-files-found: warn

      # Step 9: Upload JEV reports
      - name: Upload JEV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventlet-jev-report
          path: .jev/
          if-no-files-found: warn
