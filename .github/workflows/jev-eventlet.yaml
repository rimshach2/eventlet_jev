name: JEV Eventlet Experiment

on:
  push:
    branches:
      - jev-experiment
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout the exact historical Eventlet commit
      - name: Checkout Eventlet
        uses: actions/checkout@v4
        with:
          ref: 3ec6317dfc39403ff9e8aed88123bceb9b20a819
          fetch-depth: 0

      # 2. Restore test history from a previous workflow run
      - name: Restore previous JEV history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          mkdir -p .jev

          RUN_IDS=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow jev-eventlet.yaml \
            --branch jev-experiment \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId')

          for RUN_ID in $RUN_IDS; do
            if [ "$RUN_ID" = "$CURRENT_RUN" ]; then
              continue
            fi

            if gh run download "$RUN_ID" \
              --repo "$REPOSITORY" \
              --name jev-history \
              --dir .jev 2>/dev/null; then
              echo "Restored history from run $RUN_ID"
              break
            fi
          done

          if [ -f .jev/test-history.json ]; then
            echo "Previous test history is available."
          else
            echo "No previous history found. Starting fresh."
          fi

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Install Eventlet and pytest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      # 5. Run Eventlet tests and generate JUnit XML
      - name: Run Eventlet tests
        id: pytest
        run: |
          mkdir -p reports
          python -m pytest tests/ -q \
            --junitxml=reports/junit.xml
        continue-on-error: true

      # 6. Convert current JUnit XML to JEV history input
      - name: Prepare JEV history input
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path("reports/junit.xml")
          destination = Path(".jev/current-results.json")
          destination.parent.mkdir(parents=True, exist_ok=True)

          if not source.exists():
              print("JUnit XML missing; cannot update history.")
              raise SystemExit(0)

          root = ET.parse(source).getroot()
          results = []

          for case in root.iter("testcase"):
              name = case.get("name", "")
              classname = case.get("classname", "")

              test_id = (
                  f"{classname} › {name}"
                  if classname
                  else name
              )

              failure = case.find("failure")
              error = case.find("error")
              skipped = case.find("skipped")

              if failure is not None or error is not None:
                  status = "failed"
              elif skipped is not None:
                  status = "skipped"
              else:
                  status = "passed"

              result = {
                  "test_id": test_id,
                  "name": name,
                  "status": status,
              }

              problem = failure if failure is not None else error

              if problem is not None:
                  result["error_message"] = (
                      problem.get("message")
                      or problem.text
                      or "Test failed"
                  )[:4000]

              results.append(result)

          destination.write_text(
              json.dumps(results, indent=2),
              encoding="utf-8",
          )

          print(f"Prepared {len(results)} test results.")
          PY


      # Check whether GitHub is actually injecting the Vercel API key
      - name: Check AI Gateway key is available
        if: always()
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -n "$AI_GATEWAY_API_KEY" ]; then
            echo "AI_GATEWAY_API_KEY is present."
            echo "Key length: ${#AI_GATEWAY_API_KEY}"
          else
            echo "AI_GATEWAY_API_KEY is NOT present."
          fi
          
      # 7. Classify failures using the actual Jev decision model
      - name: Classify failures with JEV
        id: flaky
        if: always()
        uses: JevForge/jev-flaky-detective@v0
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          junit_path: reports/**/*.xml
          history_path: .jev/test-history.json
          decision_mode: jev
          comment_on_github: 'true'
          create_check_run: 'true'
          low_confidence_policy: warn

      - name: Debug JEV API status
        if: always()
        env:
          JEV_STATUS: ${{ steps.flaky.outputs.jev_status }}
          JEV_PROPOSED: ${{ steps.flaky.outputs.jev_proposed }}
          JEV_CONFIDENCE: ${{ steps.flaky.outputs.confidence }}
          JEV_PROVIDER: ${{ steps.flaky.outputs.jev_provider }}
        run: |
          echo "JEV Status: $JEV_STATUS"
          echo "JEV Proposed: $JEV_PROPOSED"
          echo "JEV Confidence: $JEV_CONFIDENCE"
          echo "JEV Provider: $JEV_PROVIDER"


      # 8. Display Jev classification
      - name: Display JEV results
        if: always()
        env:
          JEV_DECISION: ${{ steps.flaky.outputs.decision }}
          JEV_FAILURE_TYPE: ${{ steps.flaky.outputs.failure_type }}
          JEV_CLASSIFICATIONS: ${{ steps.flaky.outputs.classifications }}
          JEV_SUMMARY: ${{ steps.flaky.outputs.summary }}
        run: |
          echo "JEV Decision: $JEV_DECISION"
          echo "JEV Failure Type: $JEV_FAILURE_TYPE"
          echo "JEV Classifications: $JEV_CLASSIFICATIONS"
          echo "JEV Summary: $JEV_SUMMARY"

      # 9. Append this run's results to the historical JEV data
      - name: Append current results to history
        if: always()
        uses: JevForge/jev-flaky-detective/append-history@v0
        with:
          results_path: .jev/current-results.json
          history_path: .jev/test-history.json
          max_runs: '50'
          conclusion: ${{ steps.pytest.outcome == 'success' && 'success' || 'failure' }}

      # 10. Save updated history for future runs
      - name: Upload JEV history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-history
          path: .jev/test-history.json
          if-no-files-found: warn
          retention-days: 90

      # 11. Upload JUnit report
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventlet-junit
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 90